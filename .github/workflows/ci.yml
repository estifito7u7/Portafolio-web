name: Quality
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ci-service
          VITE_EMAILJS_TEMPLATE_ID: ci-template
          VITE_EMAILJS_PUBLIC_KEY: ci-public
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build and start container
        run: docker compose --env-file .env.example up --build --detach --wait --wait-timeout 60
      - name: Check HTTP responses and security headers
        run: node scripts/check-container.mjs
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop container
        if: always()
        run: docker compose down
