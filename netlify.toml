[build]
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Only Vite's content-hashed bundles are immutable; public/assets is not hashed.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Deploy previews and branch builds should not compete with the canonical site.
[context.deploy-preview]
  command = "npx playwright install chromium && npm run build && node scripts/noindex.mjs"
[context.branch-deploy]
  command = "npx playwright install chromium && npm run build && node scripts/noindex.mjs"
